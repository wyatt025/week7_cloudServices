#cloud-config
package_update: true
packages:
  - apache2
  - git

write_files:
  - path: /var/www/html/index.html
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: ${index_html_b64}
  - path: /var/www/html/styles.css
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: ${styles_css_b64}

runcmd:
  - [git, clone, --depth, "1", --branch, main, "https://github.com/wyatt025/week7_cloudServices.git", /tmp/week7-report]
  - [install, -d, -m, "0755", /var/www/html/screenshots]
  - [cp, -a, "/tmp/week7-report/screenshots/.", /var/www/html/screenshots]
  - [systemctl, enable, apache2]
  - [systemctl, restart, apache2]
